# --- Multimedia Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimedia-service
  namespace: citizen-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimedia-service
  template:
    metadata:
      labels:
        app: multimedia-service
    spec:
      containers:
      - name: multimedia-service
        image: multimedia-service:latest
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "3004"
        volumeMounts:
        - name: uploads-volume
          mountPath: /usr/src/app/uploads
      volumes:
      - name: uploads-volume
        emptyDir: {} # Ephemeral for POC, replace with PVC for production
        ports:
        - containerPort: 3004

---
apiVersion: v1
kind: Service
metadata:
  name: multimedia-service
  namespace: citizen-reporting
spec:
  selector:
    app: multimedia-service
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004

---
# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: citizen-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: citizen-reporting
spec:
  selector:
    app: api-gateway
  type: LoadBalancer # Or NodePort for Minikube convenience
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
