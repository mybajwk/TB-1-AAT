# --- Analytics Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: citizen-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: analytics-service:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        env:
        - name: PORT
          value: "8081"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_URL
        ports:
        - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: citizen-reporting
spec:
  selector:
    app: analytics-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

---
# --- Multimedia Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimedia-service
  namespace: citizen-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimedia-service
  template:
    metadata:
      labels:
        app: multimedia-service
    spec:
      containers:
      - name: multimedia-service
        image: multimedia-service:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        env:
        - name: PORT
          value: "3004"
        volumeMounts:
        - name: uploads-volume
          mountPath: /usr/src/app/uploads
        ports:
        - containerPort: 3004
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: multimedia-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: multimedia-service
  namespace: citizen-reporting
spec:
  selector:
    app: multimedia-service
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004

---
# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: citizen-reporting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: citizen-reporting
spec:
  selector:
    app: api-gateway
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
# Auto-Scale Auth Service based on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: citizen-reporting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# Auto-Scale Report Service based on CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: report-service-hpa
  namespace: citizen-reporting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: report-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

---
# Auto-Scale API Gateway
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: citizen-reporting
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
