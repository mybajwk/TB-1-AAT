# --- Report Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: citizen-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
      - name: report-service
        image: report-service:latest
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "3003"

        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:3002"
        ports:
        - containerPort: 3003

---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  namespace: citizen-reporting
spec:
  selector:
    app: report-service
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003



