# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: citizen-reporting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest # Needs minikube docker-env or real registry
        imagePullPolicy: Never # For local minikube images
        env:
        - name: PORT
          value: "3001"
        - name: DB_URL
          value: "postgres://user:password@postgres:5432/reporting_db" # Simplified connection string
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        ports:
        - containerPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: citizen-reporting
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

